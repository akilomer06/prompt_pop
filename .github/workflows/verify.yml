name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pytest -q
      - run: node --test tests/vercel-config.test.mjs
      - run: python scripts/validate-hosting.py
      - run: python -m playwright install --with-deps chromium
      - run: python tests/e2e_browser.py
      - run: python tests/e2e_browser.py
        env:
          E2E_SPLIT_HOSTING: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: test-results
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: promptpop_test
          POSTGRES_USER: promptpop_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promptpop_test -d promptpop_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m pytest -q
        env:
          PROMPTPOP_TEST_DATABASE_URL: postgresql://promptpop_test:isolated-ci-only@127.0.0.1:5432/promptpop_test
      - name: Verify private application schema
        run: python -m pytest -q
        env:
          PROMPTPOP_TEST_DATABASE_URL: postgresql://promptpop_test:isolated-ci-only@127.0.0.1:5432/promptpop_test
          PROMPTPOP_TEST_DATABASE_SCHEMA: promptpop_test
