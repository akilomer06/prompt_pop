# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Deploy this Blueprint in the user-confirmed OmerAkil workspace.
services:
  - type: web
    name: prompt-pop-api
    runtime: python
    region: singapore
    plan: 1c-2g
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r backend/requirements-production.lock.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: prompt-pop-assets
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: prompt-pop-db
          property: connectionString
      - key: PERSISTENT_DATA_DIR
        value: /var/data
      - key: STORAGE_DIR
        value: /var/data/assets
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: organizer
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
databases:
  - name: prompt-pop-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    diskSizeGB: 5
    ipAllowList: []
