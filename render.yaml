# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Deploy this Blueprint in the user-confirmed OmerAkil workspace.
services:
  - type: web
    name: prompt-pop-api
    runtime: python
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r backend/requirements-production.lock.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: promptpop
      - key: ASSET_STORAGE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: promptpop-private
      - key: MAX_IMAGE_PIXELS
        value: "8000000"
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: organizer
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
